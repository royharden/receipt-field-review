[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-field-review"
version = "0.1.0"
description = "Receipt review foundations: evidence, proposals, rulings and evaluation wire models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.143.1",
    "pydantic>=2,<3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
images = ["pillow==12.3.0"]
heic = ["pillow==12.3.0", "pillow-heif==1.8.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["schema.json", "README.md", "LICENSE.*"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "native_ocr: requires a separately installed and verified OCR engine",
  "live: explicitly bounded provider tests with trusted spend authority",
  "browser: requires a claimed loopback instance and a browser",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Core wire models use the locked Pydantic runtime. Decoder, storage, provider,
# statistical-engine and application dependencies are not installed by this slice.
