[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-field-review"
version = "0.1.0"
description = "Receipt review foundations: evidence, proposals, rulings and evaluation wire models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rfr.shared.*" = ["schema.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "native_ocr: requires a separately installed and verified OCR engine",
  "live: explicitly bounded provider tests with trusted spend authority",
  "browser: requires a claimed loopback instance and a browser",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Core wire models use the locked Pydantic runtime. Decoder, storage, provider,
# statistical-engine and application dependencies are not installed by this slice.
