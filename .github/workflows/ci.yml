name: Scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/contracts -p "test_scaffold.py" -v
      - run: python -m pip install uv==0.11.19
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build --wheel
      - run: python tools/check_wheel.py dist
      # This workflow intentionally makes no receipt/product/build acceptance claim.
      # Runtime/frontend/real-evaluation gates are added when those slices exist.
  frontend-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:scaffold
      - run: npm run typecheck
